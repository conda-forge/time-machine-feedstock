# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"

package:
  name: time-machine
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/time-machine/time_machine-${{ version }}.tar.gz
    sha256: 2ddaea5ad047845e07c2275bc31740f3f63f9e79ce9917dd10b23444b1fc2fbf
    target_directory: dist
    patches:
      - if: target_platform == "linux-ppc64le"
        then:
          - 0000-no-leaf-frame-pointer.patch
  - url: https://github.com/adamchainz/time-machine/archive/refs/tags/${{ version }}.tar.gz
    sha256: 0d569ae3d76002a76653a627c6c458d936b164322ec0f5148a2ca2313a83773e
    target_directory: src

build:
  number: 0
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - pip
    - python
    - setuptools
  run:
    - python
  run_constraints:
    - python-dateutil >=2.8.2

tests:
  - python:
      imports: time_machine
      pip_check: true
  - if: osx or linux64 or (linux and match(python, ">=3.12"))
    then:
      files:
        source:
          - src/tests/
      requirements:
        run:
          - backports.zoneinfo
          - coverage
          - freezegun
          - pytest
          - pytest-randomly
          - python-dateutil
          - tokenize-rt
      script:
        - coverage run --source=time_machine --branch -m pytest src/tests -vv --color=yes --tb=long -p pytester
        - coverage report --show-missing --skip-covered --fail-under=98

about:
  summary: Travel through time in your tests.
  license: MIT
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/time-machine
  repository: https://github.com/adamchainz/time-machine

extra:
  recipe-maintainers:
    - bollwyvl
